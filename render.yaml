services:
  - type: web
    name: budget-bistro-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: budget-bistro-db
          property: connectionString

databases:
  - name: budget-bistro-db
    databaseName: budget_bistro_db
    user: budget_bistro_user
    plan: free
